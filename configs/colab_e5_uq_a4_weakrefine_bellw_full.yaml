# Colab E5 A4 - UQ full + timestep sampling en campana.
# Variante arriesgada: optimiza el surrogate para la ventana donde actua el guiado.
# Es comparable con A3 salvo por training.timestep_sampling.
seed: 42

data:
  dataset_dir: ../Datos/processed_image2
  subset: solid
  min_mf_mean: null
  val_ratio: 0.20
  batch_size: 8
  num_workers: 2
  pin_memory: true
  include_fz_channel: true

model:
  kind: shell_weakrefine_operator
  sample_size: 64
  in_channels: 2
  out_channels: 13
  branch_channels:
    u: 1
    m: 6
    f: 6
  operator_width: 128
  num_operator_layers: 6
  spectral_modes_height: 16
  spectral_modes_width: 16
  time_embedding_dim: 256
  branch_hidden_channels: 128
  use_coordinate_grid: true
  predict_log_variance: true
  dropout: 0.05
  beta_schedule: squaredcos_cap_v2
  prediction_type: v_prediction

training:
  epochs: 60
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  lr_patience: 8
  lr_factor: 0.5
  early_stopping_patience: 15
  mixed_precision: true
  lambda_max: 1.0e-3
  warmup_epochs: 10
  timestep_power: 2.0
  timestep_sampling: bell
  sampling_bell_peak: 0.5
  sampling_bell_width: 0.22
  sampling_uniform_mix: 0.2
  uncertainty_weighting: true
  weak_form:
    enabled: true
    lambda_max: 1.0e-3
    warmup_epochs: 5
    num_test_modes: 4
  active_refinement:
    enabled: true
    lambda_max: 2.0e-1
    warmup_epochs: 5
    topk_ratio: 0.20
    residual_weight: 0.55
    uncertainty_weight: 0.45

mlflow:
  tracking_uri: ./mlruns
  experiment_name: colab_e5_uncertainty_architectures
  run_name_prefix: colab_e5_a4_weakrefine_bellw_full
  tags:
    model_role: engineer
    model_family: shell_weakrefine_operator
    stage: tfm_e5
    subset: solid
    uq_variant: nll_weak_refine_bell_timestep_sampling

runtime:
  device: auto
  project_name: tfm_shells
  output_root: /content/drive/MyDrive/TFM-PD/e5_runs
